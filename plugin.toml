[plugin]
id = "companion-life"
name = "Companion Life"
version = "1.0.0"
description = "Your avatar lives a life of her own: needs and a mood that change through the day, pastimes she picks herself, rare words."
author = "Taill"
license = "MIT"
icon = "icon.svg"
call_timeout_secs = 60

[entry]
command = "node"
args = ["dist/index.js"]
runtimes = ["node"]

[capabilities]
triggers = true
ui_contributions = true

[platform]
os = ["windows"]
arch = []

[config]
schema = """
{"type":"object","properties":{}}
"""

[bundle]
schema = "astra.bundle/2"
target = "noarch"

[permissions]
fire_trigger = { reason = "Plays her pastimes and says her rare words through the two Astra commands the plugin page creates." }
